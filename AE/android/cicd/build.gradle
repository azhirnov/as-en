apply plugin: 'com.android.application'

android {
	namespace 	'AE.CICD'
	compileSdk	34

	defaultConfig {
		applicationId 		'AE.CICD'
		minSdkVersion 		28 // 24+ for vulkan
		targetSdkVersion 	34

		ndk {
			abiFilters "arm64-v8a" //, "armeabi-v7a"
		}
		externalNativeBuild {
			cmake {
				arguments 	'-DANDROID_STL=c++_static',  // see https://developer.android.com/ndk/guides/cpp-support#static_runtimes
							'-DANDROID_ARM_NEON=ON',
							'-DAE_ENABLE_VULKAN=ON',
							'-DAE_ENGINE_BASE_PCH=ON'
				targets 'CICD'
			}
		}
	}

	buildTypes {
		release {
			debuggable true // to enable logcat in release
			minifyEnabled = false
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
			signingConfig signingConfigs.debug
		}
	}

	ndkVersion "29.0.13599879"

	externalNativeBuild {
		cmake {
			version '3.22.1+'
			path	'../../CMakeLists.txt'
		}
	}
	packagingOptions {
		jniLibs {
			excludes   += ['lib/**/*.so']
			pickFirsts += ['lib/**/libCICD.so']
		}
		resources  {
			excludes += '**/*.kotlin_*'
		}
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_18
		targetCompatibility JavaVersion.VERSION_18
	}
	dependenciesInfo {
		includeInApk false
		includeInBundle false
	}
}

dependencies {
	implementation 'androidx.appcompat:appcompat:1.6.1'
	implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
